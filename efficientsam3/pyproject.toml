[project]
name = "pbs-efficientsam3"
version = "0.1.0"
description = "EfficientSAM3 (Bristol/UvA/Edinburgh/SMU, 2025) - SAM3 distilled into lightweight image+text encoders"
requires-python = ">=3.10,<3.11"
# NOTE: upstream pyproject declares requires-python >= 3.12, but its README says
# 3.10+ and all 203 .py files under sam3/ compile cleanly on 3.10. We therefore
# install the dependency set directly instead of `pip install -e .`, which would
# refuse to build on 3.10. See NOTES.md.
dependencies = [
    "numpy>=1.26,<2",
    "torch==2.13.0",
    "torchvision",
    "timm>=1.0.17",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3",
    "einops>=0.7",
    "iopath>=0.1.10",
    "ftfy==6.1.1",
    "regex",
    "huggingface-hub",
    "opencv-python-headless>=4.9",
    "pillow>=10",
    "scipy>=1.10",
    "scikit-image>=0.21",
    "pycocotools>=2.0.7",
    "tqdm",
    "psutil",
    "pyyaml>=6.0.1",
    "typing-extensions",
]

[tool.uv]
package = false
