[project]
name = "pbs-fastsam"
version = "0.1.0"
description = "FastSAM (CASIA-IVA-Lab, 2023) - promptable segmentation, YOLOv8-seg based"
requires-python = ">=3.10,<3.11"
dependencies = [
    # numpy<2: the vendored ultralytics 8.0.120 fork predates the NumPy 2 ABI break.
    "numpy<2",
    "torch==2.13.0",
    "torchvision",
    "opencv-python-headless>=4.6",
    "pillow>=9",
    "matplotlib>=3.5",
    "pyyaml>=5.3",
    "requests>=2.23",
    "scipy>=1.9",
    "tqdm>=4.64",
    "pandas>=1.4",
    "seaborn>=0.11",
    "psutil",
    "py-cpuinfo",
    # setuptools>=81 dropped pkg_resources, which ultralytics 8.0.120 imports at module scope.
    "setuptools<81",
]

[tool.uv]
package = false
