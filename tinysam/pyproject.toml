[project]
name = "pbs-tinysam"
version = "0.1.0"
description = "TinySAM (Huawei Noah's Ark, AAAI 2025) - full-stage distillation, hierarchical everything"
requires-python = ">=3.10,<3.11"
dependencies = [
    "numpy<2",
    "torch==2.13.0",
    "torchvision",
    "opencv-python-headless>=4.6",
    "pillow>=9",
    "matplotlib>=3.5",
    "timm>=0.9",
    "pycocotools>=2.0.6",
]

[tool.uv]
package = false
